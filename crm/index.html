<title>EchoLight CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a production desk. Top bar with the day's tabs, one working view, a side drawer for the open deal. */
:root {
  --bg: #f3f4f6;            /* cool gel-frame grey */
  --panel: #ffffff;
  --sunk: #e8eaee;
  --line: #d5d9e0;
  --ink: #15181e;
  --muted: #5d6573;
  --accent: #c2410c;        /* tungsten amber, lamp-warm */
  --accent-ink: #ffffff;
  --accent-soft: #fde8d9;
  --cool: #1d4ed8;          /* steel-blue wash */
  --cool-soft: #dce6fb;
  --good: #15803d; --good-soft: #dcf2e3;
  --warn: #b45309; --warn-soft: #fbedd5;
  --bad: #b91c1c;  --bad-soft: #f9dede;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1216; --panel: #171b21; --sunk: #1f242c; --line: #2c333d; --ink: #e8ebf0; --muted: #98a1ae;
  --accent: #f08c4a; --accent-ink: #1a0d04; --accent-soft: #3a2415; --cool: #7ea2f5; --cool-soft: #1c2742;
  --good: #5cc98a; --good-soft: #15291e; --warn: #f0b45a; --warn-soft: #33260f; --bad: #f08080; --bad-soft: #3a1919;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1216; --panel: #171b21; --sunk: #1f242c; --line: #2c333d; --ink: #e8ebf0; --muted: #98a1ae;
  --accent: #f08c4a; --accent-ink: #1a0d04; --accent-soft: #3a2415; --cool: #7ea2f5; --cool-soft: #1c2742;
  --good: #5cc98a; --good-soft: #15291e; --warn: #f0b45a; --warn-soft: #33260f; --bad: #f08080; --bad-soft: #3a1919;
  color-scheme: dark }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--cool); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 16px; padding: 10px 16px; flex-wrap: wrap; }
.brand { font: 800 22px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); display: inline-block; }
.tabs { display: flex; gap: 2px; overflow-x: auto; flex: 1 1 auto; min-width: 0; scrollbar-width: none; }
.tabs button { background: none; border: 0; padding: 8px 12px; border-radius: 8px; color: var(--muted); font-weight: 500; white-space: nowrap; cursor: pointer; }
.tabs button[aria-current="page"] { background: var(--sunk); color: var(--ink); }
.tabs button .count { margin-inline-start: 6px; font: 500 11px var(--mono); background: var(--accent); color: var(--accent-ink); padding: 1px 6px; border-radius: 99px; }
.who { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.who img { width: 26px; height: 26px; border-radius: 50%; }

.btn { border: 1px solid var(--line); background: var(--panel); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { border-color: transparent; background: none; }
.btn.small { padding: 4px 9px; font-size: 13px; }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

main { padding-block: 20px 60px; padding-inline: 16px; max-width: 1400px; margin: 0 auto; }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px; }
h1.view-title { font: 800 34px/1.05 var(--display); text-transform: uppercase; letter-spacing: .02em; margin: 0 0 4px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 20px; }
h2 { font: 600 13px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 24px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.kpi .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .07em; }
.kpi .value { font: 800 34px/1.1 var(--display); margin-top: 4px; }
.kpi .hint { color: var(--muted); font-size: 12px; }
.kpi.alert .value { color: var(--accent); }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; min-width: 0; }
.row:last-child { border-bottom: 0; }
.row:hover .row-main b { color: var(--accent); }
.row-main { flex: 1 1 auto; min-width: 0; }
.row-main b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-main span { color: var(--muted); font-size: 13px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-side { text-align: end; flex: 0 0 auto; font-size: 13px; }
.empty { color: var(--muted); padding: 18px 0; }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.hot { background: var(--bad-soft); color: var(--bad); }
.pill.warm { background: var(--warn-soft); color: var(--warn); }
.pill.cold { background: var(--cool-soft); color: var(--cool); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.pill.claude { background: var(--cool-soft); color: var(--cool); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.wrap { white-space: normal; border-radius: 8px; }

/* Pipeline board */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 12px; }
.col { background: var(--sunk); border-radius: var(--radius); padding: 10px; min-height: 200px; display: flex; flex-direction: column; gap: 8px; }
.col.drop { outline: 2px dashed var(--accent); }
.col-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 2px 4px 6px; }
.col-head b { font: 800 16px var(--display); text-transform: uppercase; letter-spacing: .04em; }
.col-head span { color: var(--muted); font-size: 12px; }
.deal { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; cursor: grab; display: flex; flex-direction: column; gap: 4px; }
.deal:hover { border-color: var(--accent); }
.deal b { font-weight: 600; }
.deal .meta { color: var(--muted); font-size: 12px; }
.deal .foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }

/* Tables */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
.toolbar input[type=search] { flex: 1 1 220px; min-width: 0; }
input, select, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 100%; }
textarea { resize: vertical; min-height: 70px; }
.toolbar select { width: auto; }
.table-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: start; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; background: var(--sunk); }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--sunk); }
td.wrap { white-space: normal; min-width: 220px; }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .35); z-index: 40; }
.drawer { position: fixed; top: 0; bottom: 0; inset-inline-end: 0; width: min(640px, 100%); background: var(--panel); z-index: 41; display: flex; flex-direction: column; border-inline-start: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
.drawer-head h3 { margin: 0; font: 800 26px/1.1 var(--display); text-transform: uppercase; letter-spacing: .02em; overflow-wrap: anywhere; }
.drawer-body { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px; }
.section { display: flex; flex-direction: column; gap: 10px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: 12px; color: var(--muted); font-weight: 500; }
.field.full { grid-column: 1 / -1; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.checks label { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px; font-size: 13px; cursor: pointer; }
.checks input { width: auto; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.stage-track { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
.stage-track button { flex: 1 0 auto; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 8px; font-size: 12px; cursor: pointer; color: var(--muted); }
.stage-track button.done { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.stage-track button.current { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.money { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.money div { background: var(--sunk); border-radius: 8px; padding: 10px; }
.money b { display: block; font: 600 18px var(--mono); }
.timeline { display: flex; flex-direction: column; gap: 10px; }
.act { border-inline-start: 2px solid var(--line); padding-inline-start: 10px; }
.act .when { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.act p { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.copybox { background: var(--sunk); border-radius: 8px; padding: 10px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }

/* Modal */
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgb(0 0 0 / .4); }
.modal-card { background: var(--panel); border-radius: 14px; width: min(560px, 100%); max-height: 90vh; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.modal-card h3 { margin: 0; font: 800 24px var(--display); text-transform: uppercase; }

.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 80; max-width: calc(100% - 32px); }

/* Reports */
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: minmax(90px, 160px) 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.bar .track { background: var(--sunk); border-radius: 4px; height: 14px; overflow: hidden; }
.bar .fill { background: var(--accent); height: 100%; border-radius: 4px; }
.bar .fill.cool { background: var(--cool); }
.month-group { margin-bottom: 22px; }
.month-group h2 { color: var(--ink); font: 800 20px var(--display); letter-spacing: .04em; }
.show-date { font: 800 26px/1 var(--display); text-align: center; min-width: 52px; }
.show-date small { display: block; font: 500 11px var(--body); color: var(--muted); text-transform: uppercase; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.switch input { width: auto; }

/* Trial mode, drafts and warnings */
.banner.info { background: var(--cool-soft); color: var(--ink); }
.banner.info b { color: var(--cool); }
.flags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.note-box { border-radius: 8px; padding: 10px 12px; font-size: 13px; background: var(--sunk); color: var(--ink); overflow-wrap: anywhere; }
.note-box.warn { background: var(--warn-soft); }
.note-box.warn b { color: var(--warn); }
.note-box.bad { background: var(--bad-soft); }
.note-box.bad b { color: var(--bad); }
.note-box.info { background: var(--cool-soft); }
.note-box.info b { color: var(--cool); }
.drafts { display: flex; flex-direction: column; gap: 12px; max-width: 980px; }
.draft { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.draft.pending { border-color: var(--cool); }
.draft-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.draft-head .who-for { font-weight: 600; margin-inline-end: auto; min-width: 0; overflow-wrap: anywhere; }
.linkish { background: none; border: 0; padding: 0; color: var(--cool); font-weight: 600; cursor: pointer; text-align: start; }
.linkish:hover { text-decoration: underline; }
.said { border-inline-start: 3px solid var(--line); padding: 2px 0 2px 10px; color: var(--muted); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.why { font-size: 13px; color: var(--muted); }
.why b { color: var(--ink); font-weight: 600; }
.review { display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed var(--line); padding-top: 10px; }
.review textarea { min-height: 54px; }
.btn.good.on, .btn.good:hover { border-color: var(--good); color: var(--good); }
.btn.mid.on, .btn.mid:hover { border-color: var(--warn); color: var(--warn); }
.btn.bad.on, .btn.bad:hover { border-color: var(--bad); color: var(--bad); }
.btn.on { background: var(--sunk); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--panel); padding: 8px 14px; cursor: pointer; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button[disabled] { cursor: not-allowed; opacity: .6; }
.mode-card { display: flex; flex-direction: column; gap: 10px; }
.mode-card .seg { align-self: flex-start; }
.pct { font: 800 34px/1.1 var(--display); }
.drawer-tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
@media (max-width: 640px) {
  h1.view-title { font-size: 28px; }
  .who span { display: none; }
}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><i></i>EchoLight <span style="color:var(--muted)">CRM</span></div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <button class="btn primary" id="newLeadBtn" type="button">+ New lead</button>
    <div class="who" id="who"></div>
  </div>
</header>
<main id="view"></main>
<div id="drawerRoot"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(() => {
"use strict";

// ---------- Reference data ----------
const STAGES = [
  { id: "new", label: "New enquiry", open: true },
  { id: "qualifying", label: "Qualifying", open: true },
  { id: "awaiting_price", label: "Needs price", open: true },
  { id: "quoted", label: "Quote sent", open: true },
  { id: "negotiating", label: "Negotiating", open: true },
  { id: "booked", label: "Booked · deposit due", open: true },
  { id: "confirmed", label: "Confirmed · deposit paid", open: false, won: true },
  { id: "completed", label: "Event done", open: false, won: true },
  { id: "lost", label: "Lost", open: false },
];
const STAGE = Object.fromEntries(STAGES.map((s, i) => [s.id, { ...s, i }]));
const SERVICES = ["Lighting", "Sound", "LED screens", "Projection mapping", "Light & laser show", "Stage", "Trussing", "DJ", "Decor", "Event planning", "Full production"];
const SOURCES = ["WhatsApp", "Instagram", "Email", "Phone call", "Website", "Referral", "Repeat client", "Outbound (Claude)", "Outbound (team)", "Google", "Walk-in / event", "Other"];
const SEGMENTS = ["Corporate", "Wedding", "Hospitality / hotel", "Automotive", "Government", "Event agency", "Retail / mall", "Exhibition", "Private party", "Other"];
const EMIRATES = ["Abu Dhabi", "Dubai", "Al Ain", "Sharjah", "Ajman", "Umm Al Quwain", "Ras Al Khaimah", "Fujairah"];
const LOST_REASONS = ["Price", "Date not available", "Chose another supplier", "Event cancelled", "No response", "Budget too low", "Outside our services", "Other"];
const PROSPECT_STATUSES = [
  { id: "found", label: "Found" }, { id: "approved", label: "Approved to contact" }, { id: "contacted", label: "Contacted" },
  { id: "replied", label: "Replied" }, { id: "converted", label: "Became a lead" }, { id: "not_interested", label: "Not interested" },
  { id: "do_not_contact", label: "Do not contact" },
];
const VAT = 0.05;
const QUOTE_VALID_DAYS = 7;
// Another lead in one of these stages on the same date is a possible clash for crew and kit.
const CLASH_STAGES = new Set(["awaiting_price", "quoted", "negotiating", "booked", "confirmed", "completed"]);
const DRAFT_KINDS = [
  { id: "reply", label: "Replies", one: "Reply" }, { id: "follow_up", label: "Follow-ups", one: "Follow-up" },
  { id: "price", label: "Price messages", one: "Price message" }, { id: "booking", label: "Booking", one: "Booking" },
  { id: "review", label: "Review requests", one: "Review request" }, { id: "outreach", label: "Outreach", one: "Outreach" },
  { id: "other", label: "Other", one: "Other" },
];
const DRAFT_STATUS = {
  pending: { label: "To review", cls: "claude" }, good: { label: "Good", cls: "good" },
  needs_changes: { label: "Needs changes", cls: "warn" }, wrong: { label: "Wrong", cls: "bad" },
};
const ACT_LABELS = { draft: "Claude draft", site_visit: "Site visit", stage: "Stage", quote: "Quote", payment: "Payment" };
const TABS = [
  { id: "today", label: "Call sheet" }, { id: "trial", label: "Trial" }, { id: "pipeline", label: "Pipeline" }, { id: "leads", label: "Leads" },
  { id: "prospects", label: "Prospects" }, { id: "shows", label: "Shows" }, { id: "reports", label: "Reports" },
  { id: "messages", label: "Messages" }, { id: "settings", label: "Settings" },
];
const DEFAULT_SETTINGS = {
  mode: "trial",
  autopilot: { inboundReplies: true, followUps: true, outreach: false, outreachNeedsApproval: true, outreachDailyCap: 20 },
  followUpDays: [1, 3, 7],
  targetSegments: ["Corporate", "Hospitality / hotel", "Automotive", "Event agency", "Wedding"],
  notes: "",
};

// ---------- State ----------
const S = {
  db: null, user: null, me: null, downloads: null, writable: true, canEdit: false, ready: false, failed: false,
  leads: [], prospects: [], templates: [], drafts: [], draftsReady: false, settings: DEFAULT_SETTINGS,
  view: "today", openLead: null, activities: [], actUnsub: null,
  q: "", fStage: "open", fSource: "", fSegment: "", pq: "", pStatus: "",
  dShow: "pending", dKind: "", fb: {},
  profiles: {},
};
try { const v = localStorage.getItem("el-crm-view"); if (v && TABS.some(t => t.id === v)) S.view = v; } catch (e) {}
if (TABS.some(t => t.id === location.hash.slice(1))) S.view = location.hash.slice(1);

// ---------- Helpers ----------
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const todayISO = () => new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Dubai" });
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const aed = (n) => (n || n === 0) && !isNaN(n) ? "AED " + Math.round(Number(n)).toLocaleString("en-US") : "—";
const fmtDate = (iso) => { if (!iso) return "—"; const d = new Date(iso.length <= 10 ? iso + "T12:00:00" : iso); return isNaN(d) ? esc(iso) : d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }); };
const ago = (ts) => { if (!ts) return ""; const m = Math.round((Date.now() - ts) / 60000); if (m < 1) return "just now"; if (m < 60) return m + "m ago"; const h = Math.round(m / 60); if (h < 48) return h + "h ago"; return Math.round(h / 24) + "d ago"; };
const digits = (p) => String(p || "").replace(/\D/g, "").replace(/^00/, "");
const daysUntil = (iso) => iso ? Math.round((new Date(iso + "T12:00:00") - new Date(todayISO() + "T12:00:00")) / 86400000) : null;
const leadTitle = (l) => l.company ? `${l.name || "Unnamed"} · ${l.company}` : (l.name || "Unnamed lead");
const isOpen = (l) => STAGE[l.stage]?.open ?? true;
const isWon = (l) => !!STAGE[l.stage]?.won;
const temp = (l) => l.priority ? `<span class="pill ${esc(l.priority)}">${esc(l.priority)}</span>` : "";
const stagePill = (l) => `<span class="pill ${l.stage === "lost" ? "bad" : isWon(l) ? "good" : l.stage === "awaiting_price" ? "accent" : ""}">${esc(STAGE[l.stage]?.label || l.stage)}</span>`;
const byLabel = (by) => by === "claude" ? `<span class="pill claude">Claude</span>` : (by ? esc(S.profiles[by]?.name || "Team") : "");
const fmtDateAr = (iso) => { if (!iso) return ""; const d = new Date(iso + "T12:00:00"); return isNaN(d) ? iso : d.toLocaleDateString("ar-AE-u-nu-latn", { day: "numeric", month: "long", year: "numeric" }); };
const isTrial = () => S.settings.mode !== "live";
const fmtDuration = (ms) => { if (ms == null || isNaN(ms)) return "—"; const m = Math.max(0, Math.round(ms / 60000)); if (m < 60) return m + "m"; const h = m / 60; if (h < 48) return (h < 10 ? h.toFixed(1) : Math.round(h)) + "h"; return Math.round(h / 24) + "d"; };
// A price the customer hasn't been told yet: flagged for Claude, never marked sent, or newer than the last quote sent.
// Only flagged prices count once a deal is booked (older booked deals often have no quoteSentAt).
const priceUnsent = (l) => !!l.priceAED && l.stage !== "lost" && (!!l.priceToSend || ((STAGE[l.stage]?.i ?? 0) <= STAGE.negotiating.i && (!l.quoteSentAt || (!!l.priceSetAt && l.priceSetAt > l.quoteSentAt))));
// The date a price message sent today is valid until, or the stored date for a quote already sent.
const validUntilFor = (l) => (!priceUnsent(l) && l.quoteValidUntil) ? l.quoteValidUntil : addDays(todayISO(), QUOTE_VALID_DAYS);
function quoteValidity(l) {
  if (!l.quoteValidUntil || priceUnsent(l) || !["quoted", "negotiating"].includes(l.stage)) return null;
  const d = daysUntil(l.quoteValidUntil);
  if (d < 0) return { cls: "bad", text: `Expired ${-d}d ago`, expired: true, d };
  if (d === 0) return { cls: "warn", text: "Valid until today", d };
  if (d === 1) return { cls: "warn", text: "Valid until tomorrow", d };
  return { cls: "good", text: `Valid until ${fmtDate(l.quoteValidUntil)}`, d };
}
const validityPill = (l) => { const v = quoteValidity(l); return v ? `<span class="pill ${v.cls}">${esc(v.text)}</span>` : ""; };
function clashesFor(l) {
  if (!l || !l.eventDate || l.stage === "lost") return [];
  return S.leads.filter((o) => o.id !== l.id && o.eventDate === l.eventDate && CLASH_STAGES.has(o.stage));
}
const clashNames = (list) => list.map((o) => `${leadTitle(o)} (${STAGE[o.stage]?.label || o.stage})`).join(", ");
function leadFlags(l, opts = {}) {
  const f = [];
  if (l.claudePaused) f.push(`<span class="pill warn">Claude paused</span>`);
  if (l.doNotContact) f.push(`<span class="pill bad">Do not contact</span>`);
  if (opts.clash !== false && l.eventDate && daysUntil(l.eventDate) >= 0 && l.stage !== "lost" && l.stage !== "completed") {
    const c = clashesFor(l); if (c.length) f.push(`<span class="pill bad wrap" title="${esc(clashNames(c))}">Same date as ${esc(c.map((o) => o.name || o.company || "another lead").join(", "))}</span>`);
  }
  return f.join(" ");
}
// Re-rendering replaces inputs; keep the focused one (and its caret) if it is redrawn with the same id.
function keepFocus(fn) {
  const a = document.activeElement;
  const id = a && a.id && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) ? a.id : null;
  let s = null, e = null; try { s = a.selectionStart; e = a.selectionEnd; } catch (err) {}
  fn();
  if (!id) return;
  const n = document.getElementById(id);
  if (n && n !== a) { n.focus({ preventScroll: true }); try { if (s != null) n.setSelectionRange(s, e); } catch (err) {} }
}

function toast(msg) {
  const el = document.createElement("div"); el.className = "toast"; el.textContent = msg; el.setAttribute("role", "status");
  $("#toastRoot").replaceChildren(el); setTimeout(() => el.remove(), 3200);
}
function fail(e) {
  console.error(e);
  if (e && e.code === "invalid_argument") { S.writable = false; toast("You can view this CRM but not change it. Ask the owner for Contributor access."); render(); return; }
  if (e && e.code === "quota_exceeded") { toast("The CRM storage is full. Archive old leads to make room."); return; }
  toast("Couldn't save. Check your connection and try again.");
}
async function write(fn) {
  if (!S.db) { toast("Shared data isn't available in this view."); return false; }
  try { await fn(); return true; } catch (e) { fail(e); return false; }
}
async function resolveProfiles(ids) {

}

// Fields that mark a quote as sent today: valid for 7 days, nothing left for Claude to send.
function quoteSentPatch(now = Date.now()) {
  return { priceToSend: false, quoteSentAt: now, quoteValidUntil: addDays(todayISO(), QUOTE_VALID_DAYS), nextAction: "Follow up on quote", nextActionDate: addDays(todayISO(), 1) };
}
async function markQuoteSent(l, how = "Quote marked as sent by the team") {
  const patch = quoteSentPatch();
  const note = `${how}. Valid until ${fmtDate(patch.quoteValidUntil)}.`;
  let ok;
  if ((STAGE[l.stage]?.i ?? 0) < STAGE.quoted.i) ok = await setStage(l, "quoted", patch, note);
  else ok = await updateLead(l.id, patch, { type: "quote", text: note });
  if (ok !== false) toast(`Quote marked as sent. Valid until ${fmtDate(patch.quoteValidUntil)}.`);
  return ok;
}
async function addActivity(leadId, type, text, extra = {}) {
  if (!S.db) return;
  await S.db.collection("activities").add({ leadId, type, text, at: Date.now(), by: S.me?.id || null, ...extra });
}
async function updateLead(id, patch, activity) {
  return write(async () => {
    await S.db.doc("leads/" + id).update({ ...patch, updatedAt: Date.now() });
    if (activity) await addActivity(id, activity.type, activity.text);
  });
}
async function setStage(lead, stage, extra = {}, note = "") {
  if (lead.stage === stage) return true;
  const hist = { ...(lead.stageHistory || {}), [stage]: Date.now() };
  const patch = { stage, stageHistory: hist, ...extra };
  if (stage === "awaiting_price") { patch.priceRequestedAt = Date.now(); patch.nextAction = lead.dateCheckedBy ? "Team to price this project" : "Team: check date and kit, then price"; patch.nextActionDate = todayISO(); }
  if (stage === "booked" && lead.depositStatus !== "received") { patch.depositStatus = "requested"; patch.nextAction = "Collect 50% deposit"; }
  if (stage === "confirmed") { patch.depositStatus = "received"; patch.depositReceivedAt = lead.depositReceivedAt || Date.now(); patch.balanceStatus = "due_on_event"; patch.nextAction = "Prepare production; collect balance on event day"; patch.nextActionDate = lead.eventDate || todayISO(); }
  // Review and referral requests only once the event is done, and never to someone who asked not to be contacted.
  if (stage === "completed") { patch.nextAction = lead.doNotContact ? "" : "Ask for a review and referral"; patch.nextActionDate = lead.doNotContact ? "" : addDays(todayISO(), 1); }
  if (stage === "lost") { patch.nextAction = ""; patch.nextActionDate = ""; patch.priceToSend = false; }
  const text = `Stage: ${STAGE[lead.stage]?.label || lead.stage} → ${STAGE[stage].label}${note ? ". " + note : ""}`;
  return updateLead(lead.id, patch, { type: "stage", text });
}

// ---------- Boot ----------
async function boot() {
  render();
  if (!window.claude?.use) { S.failed = true; render(); return; }
  // Downloads is optional: resolve it on its own so a slow answer never holds up the data.
  Promise.resolve(window.claude.use("downloads")).then((d) => { S.downloads = d || null; if (d) render(); }).catch(() => {});
  const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  S.db = db; S.user = user;
  if (user) {
    try { S.me = await user.me(); S.canEdit = !!S.me?.canEdit; } catch (e) {}
    try { const w = await user.can("data.write"); if (w === false) S.writable = false; } catch (e) {}
  }
  if (!db) { S.failed = true; renderTop(); render(); return; }
  const err = (e) => { console.error(e); if (e?.code === "revoked") { S.failed = true; render(); } };
  db.collection("leads").orderBy("updatedAt", "desc").limit(1000).onSnapshot((snap) => {
    S.leads = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    S.ready = true;
    resolveProfiles(S.leads.map((l) => l.assignedTo)).then(() => { render(); refreshDrawer(); });
    render(); refreshDrawer();
  }, err);
  db.collection("prospects").orderBy("updatedAt", "desc").limit(1000).onSnapshot((snap) => {
    S.prospects = snap.docs.map((d) => ({ id: d.id, ...d.data() })); renderTop(); if (S.view === "prospects" || S.view === "today") render();
  }, err);
  db.collection("templates").limit(200).onSnapshot((snap) => {
    S.templates = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (a.order ?? 99) - (b.order ?? 99));
    if (S.view === "messages") render(); refreshDrawer();
  }, err);
  db.collection("drafts").orderBy("createdAt", "desc").limit(500).onSnapshot((snap) => {
    S.drafts = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    S.draftsReady = true;
    resolveProfiles(S.drafts.map((d) => d.reviewedBy)).then(() => { if (S.view === "trial") render(); });
    if (["trial", "today", "reports"].includes(S.view)) render(); else renderTop();
    refreshDrawer();
  }, err);
  db.doc("config/settings").onSnapshot((snap) => {
    const data = snap.exists ? snap.data() : {};
    S.settings = { ...DEFAULT_SETTINGS, ...data, mode: data.mode === "live" ? "live" : "trial", autopilot: { ...DEFAULT_SETTINGS.autopilot, ...(data.autopilot || {}) } };
    render(); refreshDrawer();
  }, err);
  renderTop();
}

function leadRow(l, side) {
  const flags = leadFlags(l);
  return `<div class="row" data-lead="${esc(l.id)}"><div class="row-main"><b>${esc(leadTitle(l))}</b><span>${esc([l.eventType, l.eventDate && fmtDate(l.eventDate), l.emirate].filter(Boolean).join(" · ") || "No event details yet")}</span>${flags ? `<div class="flags">${flags}</div>` : ""}</div><div class="row-side">${side}</div></div>`;
}
function emptyLeads(msg) { return `<div class="empty">${msg}</div>`; }

function viewToday() {
  const t = todayISO();
  const open = S.leads.filter(isOpen);
  // Prices: projects waiting for a price, plus any price (new or revised, any stage) the customer hasn't been sent yet.
  const priceList = S.leads.filter((l) => l.stage !== "lost" && ((l.stage === "awaiting_price" && !l.priceAED) || priceUnsent(l)))
    .sort((a, b) => (!!a.priceAED - !!b.priceAED) || ((a.priceRequestedAt || a.priceSetAt || 0) - (b.priceRequestedAt || b.priceSetAt || 0)));
  const needPrice = priceList.filter((l) => !l.priceAED);
  const due = open.filter((l) => l.stage !== "awaiting_price" && !priceUnsent(l) && l.nextActionDate && l.nextActionDate <= t).sort((a, b) => a.nextActionDate.localeCompare(b.nextActionDate));
  const fresh = S.leads.filter((l) => l.stage === "new");
  const shows = S.leads.filter((l) => ["booked", "confirmed"].includes(l.stage) && l.eventDate && daysUntil(l.eventDate) >= 0 && daysUntil(l.eventDate) <= 21).sort((a, b) => a.eventDate.localeCompare(b.eventDate));
  const expiring = S.leads.filter((l) => ["quoted", "negotiating"].includes(l.stage) && l.quoteValidUntil && !priceUnsent(l) && l.quoteValidUntil <= addDays(t, 1)).sort((a, b) => a.quoteValidUntil.localeCompare(b.quoteValidUntil));
  const clashing = S.leads.filter((l) => l.eventDate && l.eventDate >= t && !["lost", "completed"].includes(l.stage) && clashesFor(l).length).sort((a, b) => a.eventDate.localeCompare(b.eventDate));
  const pipeline = S.leads.filter((l) => ["quoted", "negotiating", "booked"].includes(l.stage)).reduce((s, l) => s + (Number(l.priceAED) || 0), 0);
  const month = t.slice(0, 7);
  const wonMonth = S.leads.filter((l) => isWon(l) && l.depositReceivedAt && new Date(l.depositReceivedAt).toISOString().slice(0, 7) === month).reduce((s, l) => s + (Number(l.priceAED) || 0), 0);
  const toApprove = S.prospects.filter((p) => p.status === "found").length;
  const toReview = S.drafts.filter((d) => (d.status || "pending") === "pending").length;
  const waitingSince = needPrice[0]?.priceRequestedAt;
  const waitPill = (l) => { const h = l.priceRequestedAt ? (Date.now() - l.priceRequestedAt) / 3600000 : 0; return `<span class="pill ${h >= 24 ? "bad" : h >= 3 ? "warn" : "accent"}">${l.priceRequestedAt ? "Waiting " + ago(l.priceRequestedAt).replace(" ago", "") : "Waiting"}</span>`; };
  const priceSide = (l) => {
    if (!l.priceAED) return waitPill(l);
    if (l.priceToSend) return `<span class="pill good">Priced · ${isTrial() ? "Claude drafts it" : "Claude sends it"}</span>`;
    return `<span class="pill warn">Send it, then mark sent</span>`;
  };

  const kpis = `<div class="kpis">
    <div class="kpi ${needPrice.length ? "alert" : ""}"><div class="label">Waiting for your price</div><div class="value num">${needPrice.length}</div><div class="hint">${waitingSince ? "Oldest waiting " + ago(waitingSince) : "Nobody is waiting"}</div></div>
    ${isTrial() ? `<div class="kpi ${toReview ? "alert" : ""}"><div class="label">Drafts to review</div><div class="value num">${toReview}</div><div class="hint"><a href="#trial" data-go="trial">Open the Trial tab</a></div></div>` : ""}
    <div class="kpi ${due.length ? "alert" : ""}"><div class="label">Follow-ups due</div><div class="value num">${due.length}</div><div class="hint">Today and overdue</div></div>
    <div class="kpi"><div class="label">Open quotes</div><div class="value num">${aed(pipeline).replace("AED ", "")}</div><div class="hint">AED excl. VAT, quoted to booked</div></div>
    <div class="kpi"><div class="label">Won this month</div><div class="value num">${aed(wonMonth).replace("AED ", "")}</div><div class="hint">AED excl. VAT, deposit received</div></div>
  </div>`;

  if (S.ready && !S.leads.length) {
    return `<h1 class="view-title">Call sheet</h1><p class="sub">${fmtDate(t)} · Abu Dhabi</p>${kpis}
      <div class="card"><h2>No leads yet</h2><p>Add your first enquiry with <b>+ New lead</b>, or ask Claude to import past enquiries from your WhatsApp and email. Every new lead lands in <b>New enquiry</b> and moves through the pipeline from there.</p></div>`;
  }
  const loading = (msg) => emptyLeads(S.ready ? msg : "Loading…");
  return `<h1 class="view-title">Call sheet</h1><p class="sub">${fmtDate(t)} · Abu Dhabi${toApprove ? ` · <a href="#prospects" data-go="prospects">${toApprove} prospect${toApprove > 1 ? "s" : ""} waiting for approval</a>` : ""}</p>${kpis}
  <div class="grid2">
    <section class="card"><h2>Price these projects</h2><div class="list">${priceList.map((l) => leadRow(l, priceSide(l))).join("") || loading("No projects waiting for a price.")}</div></section>
    <section class="card"><h2>Quotes expiring</h2><div class="list">${expiring.map((l) => { const v = quoteValidity(l); return leadRow(l, `${validityPill(l)}<div style="color:var(--muted)">${v?.expired ? "Team re-confirms the price" : esc(aed(l.priceAED))}</div>`); }).join("") || loading("No quotes expire today or tomorrow.")}</div></section>
    <section class="card"><h2>Follow up today</h2><div class="list">${due.map((l) => leadRow(l, `${l.nextActionDate < t ? `<span class="pill bad">Overdue ${-daysUntil(l.nextActionDate)}d</span>` : `<span class="pill">Today</span>`}<div style="color:var(--muted)">${esc(l.nextAction || "")}</div>`)).join("") || loading("Nothing due. Nice.")}</div></section>
    <section class="card"><h2>New enquiries</h2><div class="list">${fresh.map((l) => leadRow(l, `${esc(l.source || "")}<div style="color:var(--muted)">${ago(l.createdAt)}</div>`)).join("") || loading("No new enquiries.")}</div></section>
    <section class="card"><h2>Shows in the next 3 weeks</h2><div class="list">${shows.map((l) => leadRow(l, `<b class="num">${daysUntil(l.eventDate) === 0 ? "Today" : "in " + daysUntil(l.eventDate) + "d"}</b><div>${paymentPills(l)}</div>`)).join("") || loading("No booked shows in the next 3 weeks.")}</div></section>
    <section class="card"><h2>Date clashes</h2><div class="list">${clashing.map((l) => leadRow(l, `<span class="pill">${esc(STAGE[l.stage]?.label || l.stage)}</span>`)).join("") || loading("No two upcoming events share a date.")}</div></section>
  </div>`;
}

const csvTime = (ms) => ms ? new Date(ms).toLocaleString("sv-SE", { timeZone: "Asia/Dubai" }).slice(0, 16) : "";
function csvCell(v) {
  let s = v == null ? "" : Array.isArray(v) ? v.join("; ") : String(v);

  return '"' + s.replace(/"/g, '""') + '"';
}
const toCSV = (cols, rows) => [cols.map(([, h]) => csvCell(h)).join(","), ...rows.map((r) => cols.map(([k, , f]) => csvCell(f ? f(r[k], r) : r[k])).join(","))].join("\r\n");

  ["eventType", "Event type"], ["eventDate", "Event date"], ["venue", "Venue"], ["emirate", "Emirate"], ["guests", "Guests"],

  ["priceAED", "Price (AED excl. VAT)"], ["quoteDetails", "Quote wording"], ["priceToSend", "Price waiting for Claude"],
  ["quoteSentAt", "Quote sent", csvTime], ["quoteValidUntil", "Quote valid until"], ["dateCheckedBy", "Date and kit checked by"],
  ["crew", "Crew"], ["kit", "Kit"], ["depositStatus", "Deposit"], ["balanceStatus", "Balance"], ["lostReason", "Lost reason"],
  ["priority", "Temperature"], ["nextAction", "Next step"], ["nextActionDate", "Next step date"], ["claudePaused", "Claude paused"],
  ["marketingOptIn", "Agreed to offers"], ["doNotContact", "Do not contact"], ["createdAt", "Created", csvTime],
  ["firstReplyAt", "First reply", csvTime], ["lastContactAt", "Last contact", csvTime], ["updatedAt", "Updated", csvTime],
];
const PROSPECT_CSV = [
  ["id", "Prospect id"], ["company", "Company"], ["segment", "Segment"], ["emirate", "Emirate"], ["website", "Website"],
  ["contactName", "Contact name"], ["role", "Role"], ["email", "Business email"], ["phone", "Business phone"], ["sourceUrl", "Found at"],
  ["whyFit", "Why they fit"], ["status", "Status", (v) => PROSPECT_STATUSES.find((s) => s.id === v)?.label || v],

async function exportCSV(kind) {
  if (!S.downloads) return;
  const data = "\ufeff" + (kind === "leads" ? toCSV(LEAD_CSV, S.leads) : toCSV(PROSPECT_CSV, S.prospects));
  const filename = `echolight-${kind}-${todayISO()}.csv`;

}

function viewReports() {
  const leads = S.leads;
  const funnel = ["new", "qualifying", "awaiting_price", "quoted", "negotiating", "booked", "confirmed", "completed"];
  const reached = (l, st) => { const i = STAGE[st].i; if (l.stage !== "lost") return STAGE[l.stage].i >= i; return Object.keys(l.stageHistory || {}).some((s) => s !== "lost" && STAGE[s]?.i >= i); };
  const fCounts = funnel.map((st) => ({ st, n: leads.filter((l) => reached(l, st)).length }));
  const maxF = Math.max(1, ...fCounts.map((x) => x.n));
  const won = leads.filter(isWon), lost = leads.filter((l) => l.stage === "lost");
  const winRate = won.length + lost.length ? Math.round(100 * won.length / (won.length + lost.length)) : null;
  const group = (key, list, none = "Unknown") => { const m = {}; list.forEach((l) => { const k = String(l[key] || "").trim() || none; m[k] ||= { n: 0, won: 0, value: 0 }; m[k].n++; if (isWon(l)) { m[k].won++; m[k].value += Number(l.priceAED) || 0; } }); return Object.entries(m).sort((a, b) => b[1].n - a[1].n); };
  const src = group("source", leads), seg = group("segment", leads), camp = group("campaign", leads, "No campaign recorded");
  const lostR = {}; lost.forEach((l) => { const k = l.lostReason || "Not recorded"; lostR[k] = (lostR[k] || 0) + 1; });
  const months = {}; won.forEach((l) => { if (!l.eventDate) return; const k = l.eventDate.slice(0, 7); months[k] = (months[k] || 0) + (Number(l.priceAED) || 0); });
  const mKeys = Object.keys(months).sort().slice(-12); const maxM = Math.max(1, ...mKeys.map((k) => months[k]));
  const bars = (rows, max, cls = "") => rows.map(([label, val, right]) => `<div class="bar"><span>${esc(label)}</span><div class="track"><div class="fill ${cls}" style="width:${Math.max(2, 100 * val / max)}%"></div></div><span class="num">${right}</span></div>`).join("");
  const avgDeal = won.length ? won.reduce((s, l) => s + (Number(l.priceAED) || 0), 0) / won.length : 0;

document.addEventListener("click", async (e) => {

  const op = e.target.closest("[data-open-prospect]"); if (op) { const p = S.prospects.find((x) => x.id === op.dataset.openProspect); if (p) openProspectModal(p); return; }
  const ds = e.target.closest("[data-dshow]"); if (ds) { S.dShow = ds.dataset.dshow; render(); return; }
  const rv = e.target.closest("[data-review]"); if (rv) { reviewDraft(rv.dataset.draft, rv.dataset.review); return; }
  const cd = e.target.closest("[data-copy-draft]"); if (cd) { const d = S.drafts.find((x) => x.id === cd.dataset.copyDraft); if (d) copyText(d.body || "", cd.closest(".draft")?.querySelector(".copybox")); return; }
  const md = e.target.closest("[data-mode]"); if (md) { setMode(md.dataset.mode); return; }
  if (e.target.closest("#exportLeads")) { exportCSV("leads"); return; }
  if (e.target.closest("#exportProspects")) { exportCSV("prospects"); return; }
  const leadEl = e.target.closest("[data-lead]");
  if (leadEl && !e.target.closest("button") && $("#view").contains(leadEl)) { openDrawer(leadEl.dataset.lead); return; }
  const pa = e.target.closest("[data-papprove]"); if (pa) { const p = S.prospects.find((x) => x.id === pa.dataset.papprove); await write(() => S.db.doc("prospects/" + p.id).update({ status: "approved", updatedAt: Date.now() })); toast("Approved for outreach"); return; }
  const pd = e.target.closest("[data-pdnc]"); if (pd) { await write(() => S.db.doc("prospects/" + pd.dataset.pdnc).update({ status: "do_not_contact", updatedAt: Date.now() })); toast("Marked do not contact"); return; }
  const pc = e.target.closest("[data-pconvert]"); if (pc) { convertProspect(pc.dataset.pconvert); return; }
  const pr = e.target.closest("tr[data-prospect]"); if (pr) { openProspectModal(S.prospects.find((p) => p.id === pr.dataset.prospect)); return; }
  if (e.target.closest("#addProspect")) { openProspectModal(null); return; }
  if (e.target.closest("#addTemplate")) { openTemplateModal(null); return; }
  const te = e.target.closest("[data-tedit]"); if (te) { openTemplateModal(S.templates.find((t) => t.id === te.dataset.tedit)); return; }
  if (e.target.closest("#saveNotes")) { if (await saveSettings({ notes: $("#setNotes").value })) { S.notesDraft = undefined; toast("Instructions saved"); } return; }
});
async function copyText(text, box) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch (err) { if (box) { const r = document.createRange(); r.selectNodeContents(box); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } toast("Selected. Press Ctrl+C to copy."); }
}
async function reviewDraft(id, status) {
  const d = S.drafts.find((x) => x.id === id); if (!d || !DRAFT_STATUS[status]) return;
  const feedback = String(S.fb[id] ?? d.feedback ?? "").trim();
  if (status !== "good" && !feedback) {
    toast("Add a short note on what to change, so Claude can learn from it.");
    const box = document.querySelector(`[data-fb="${CSS.escape(id)}"]`); if (box) box.focus();
    return;
  }
  const ok = await write(() => S.db.doc("drafts/" + id).update({ status, feedback, reviewedAt: Date.now(), reviewedBy: S.me?.id || null }));
  if (ok) { delete S.fb[id]; toast(status === "good" ? "Rated good" : status === "wrong" ? "Rated wrong. Claude will read your note." : "Rated needs changes. Claude will read your note."); }
}
function setMode(mode) {
  if (!S.canEdit || (mode !== "trial" && mode !== "live") || mode === S.settings.mode) return;
  const patch = { mode, modeChangedAt: Date.now(), modeChangedBy: S.me?.id || null };
  if (mode === "trial") { saveSettings(patch).then((ok) => ok && toast("Trial mode on. Claude drafts only.")); return; }
  openConfirm("Switch to Live?", "In Live mode Claude sends messages to customers and prospects itself, following the autopilot switches. Only switch once the drafts in the Trial tab are reliably good. You can switch back to Trial at any time.", "Switch to Live", async () => { if (await saveSettings(patch)) toast("Live mode on. Claude may now send messages."); });
}
document.addEventListener("input", (e) => {
  if (e.target.dataset?.fb) { S.fb[e.target.dataset.fb] = e.target.value; return; }
  if (e.target.id === "setNotes") { S.notesDraft = e.target.value; return; }
  if (e.target.id === "q") { S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos); }
  if (e.target.id === "pq") { S.pq = e.target.value; const pos = e.target.selectionStart; render(); const q = $("#pq"); q.focus(); q.setSelectionRange(pos, pos); }
});
document.addEventListener("change", async (e) => {
  const id = e.target.id;
  if (id === "fStage") { S.fStage = e.target.value; render(); }
  if (id === "fSource") { S.fSource = e.target.value; render(); }
  if (id === "fSegment") { S.fSegment = e.target.value; render(); }
  if (id === "pStatus") { S.pStatus = e.target.value; render(); }
  if (id === "dKind") { S.dKind = e.target.value; render(); }
  if (e.target.dataset.auto) { if (await saveSettings({ autopilot: { ...S.settings.autopilot, [e.target.dataset.auto]: e.target.checked } })) toast("Saved"); }
  if (id === "cap") { if (await saveSettings({ autopilot: { ...S.settings.autopilot, outreachDailyCap: Math.max(0, Math.min(100, Number(e.target.value) || 0)) } })) toast("Saved"); }
  if (e.target.dataset.seg) { const set = new Set(S.settings.targetSegments || []); e.target.checked ? set.add(e.target.dataset.seg) : set.delete(e.target.dataset.seg); await saveSettings({ targetSegments: [...set] }); }
});
async function saveSettings(patch) {
  if (!S.db) return false;
  const next = { ...S.settings, ...patch, updatedAt: Date.now() };
  try { await S.db.doc("config/settings").set(next); return true; }
  catch (e) { console.error(e); toast(e?.code === "invalid_argument" ? "Only the owner and editors can change settings." : "Couldn't save settings. Try again."); render(); return false; }
}

let dragId = null;
document.addEventListener("dragstart", (e) => { const d = e.target.closest?.(".deal"); if (d) { dragId = d.dataset.lead; e.dataTransfer.effectAllowed = "move"; } });
document.addEventListener("dragover", (e) => { const c = e.target.closest?.(".col"); if (c && dragId) { e.preventDefault(); c.classList.add("drop"); } });
document.addEventListener("dragleave", (e) => { const c = e.target.closest?.(".col"); if (c) c.classList.remove("drop"); });
document.addEventListener("drop", async (e) => {
  const c = e.target.closest?.(".col"); if (!c || !dragId) return; e.preventDefault(); c.classList.remove("drop");

  if (lead) requestStage(lead, stage);
});

// Stage changes that need extra input
function requestStage(lead, stage) {
  if (lead.stage === stage) return;
  if (stage === "quoted") {
    // "Quote sent" means the customer has the price: mark an entered price as sent, or enter one first.
    if (lead.priceAED) return openConfirm("Mark the quote as sent?", `Only if the customer already has the price. It stays valid for ${QUOTE_VALID_DAYS} days, until ${fmtDate(addDays(todayISO(), QUOTE_VALID_DAYS))}.`, "Mark quote sent", () => markQuoteSent(lead));
    return openPriceModal(lead);
  }
  if (stage === "lost") return openLostModal(lead);
  setStage(lead, stage);
}

const allowedTemplates = (l) => S.templates.filter((t) => t.stage !== "completed" || l.stage === "completed");
function drawerAlerts(l) {
  const out = [];
  if (l.claudePaused) out.push(["warn", "Claude is paused on this lead.", "It won't draft or send anything here. The team handles this customer."]);
  if (l.doNotContact) out.push(["bad", "Do not contact.", "This person asked not to be messaged again, on any channel."]);
  const c = clashesFor(l);
  if (c.length) out.push(["bad", `Date clash on ${fmtDate(l.eventDate)}.`, `Also on this date: ${clashNames(c)}. Check crew and kit before pricing or confirming.`]);
  if (l.stage === "awaiting_price" && !l.priceAED && !l.dateCheckedBy) out.push(["warn", "Check the date, crew and kit before pricing.", "The price form asks who checked."]);
  if (l.priceToSend && l.stage !== "lost") out.push(["info", "Price waiting for Claude.", isTrial() ? "On its next run Claude drafts the price message for you to review in the Trial tab. Nothing is sent in trial mode." : "On its next run Claude sends this price to the customer."]);
  else if (priceUnsent(l)) out.push(["warn", "This price isn't marked as sent.", "Once the customer has it, press Mark quote sent. The quote then stays valid for " + QUOTE_VALID_DAYS + " days."]);
  const v = quoteValidity(l);
  if (v?.expired) out.push(["bad", `Quote expired ${-v.d}d ago.`, "The team re-confirms the price and availability before the customer can book. Use Change price to enter it again (same or new)."]);

    const drafts = S.drafts.filter((d) => d.leadId === l.id).sort((a, b) => ((draftStatus(a) === "pending") === (draftStatus(b) === "pending") ? (b.createdAt || 0) - (a.createdAt || 0) : draftStatus(a) === "pending" ? -1 : 1));

    // Message picker: rebuild only when the allowed list changes, keeping the choice.

    if (pick.dataset.sig !== sig) {
      const prev = pick.value;
      pick.innerHTML = allowed.map((t) => `<option value="${esc(t.id)}">${esc(t.name)} · ${t.language === "ar" ? "AR" : "EN"} · ${esc(t.channel)}</option>`).join("") || `<option value="">No messages yet</option>`;
      pick.dataset.sig = sig;
      const lang = l.language === "ar" ? "ar" : "en";
      const def = allowed.some((t) => t.id === prev) ? prev : (allowed.find((t) => t.stage === l.stage && t.language === lang) || allowed.find((t) => t.language === lang) || allowed[0])?.id;

function fillTemplate(text, l, lang) {
  const ar = lang === "ar";
  const date = (iso) => ar ? fmtDateAr(iso) : fmtDate(iso);
  const first = String(l.name || "").trim().split(/\s+/)[0] || "";
  let s = String(text || "");
  // No name on file: drop the placeholder cleanly ("Hi {name}, thanks" → "Hi, thanks").
  s = first ? s.replace(/\{name\}/g, first) : s.replace(/,?[  ]?\{name\}/g, "");
  return s.replace(/\{company\}/g, l.company || (ar ? "شركتكم" : "your company"))
    .replace(/\{event\}/g, l.eventType || (ar ? "فعاليتكم" : "event"))
    .replace(/\{date\}/g, l.eventDate ? date(l.eventDate) : (ar ? "الموعد المحدد" : "the date you mentioned"))
    .replace(/\{venue\}/g, l.venue || (ar ? "المكان" : "the venue"))
    .replace(/\{price\}/g, l.quoteDetails || (l.priceAED ? aed(l.priceAED) + " + 5% VAT" : (ar ? "[السعر من الفريق]" : "[price from the team]")))
    .replace(/\{validUntil\}/g, date(validUntilFor(l)));
}
function updateTemplatePreview() {
  const l = lead(); const pick = $("#tplPick"); if (!l || !pick) return;
  const t = S.templates.find((x) => x.id === pick.value);
  const hasPrice = !!t && /\{price\}/.test(t.body || "");
  // Any message that quotes the price or its validity date must not go out on an expired quote (D2).
  const mentionsQuote = !!t && /\{(price|validUntil)\}/.test(t.body || "");
  // Expiry-day reminders ("valid until today") only make sense on the day the quote expires.
  const saysToday = !!t && /\{validUntil\}/.test(t.body || "") && /valid until today|لنهاية اليوم/i.test(t.body || "");
  const v = quoteValidity(l);
  let block = "";
  if (l.doNotContact) block = "This person asked not to be contacted.";
  else if (hasPrice && !l.priceAED) block = "There's no price yet. The team enters it first with Enter price.";
  else if (mentionsQuote && v?.expired) block = `This quote expired ${-v.d}d ago. Don't send it again as valid: re-confirm the price first with Change price, or use a "quote expired" message.`;
  else if (saysToday && (!v || v.d !== 0)) block = v ? `This message says the quote is valid until today, but it is valid until ${fmtDate(l.quoteValidUntil)}. Use the day-1 follow-up instead.` : "This message says the quote is valid until today, but no sent quote is running for this lead.";
  S.tplBlocked = !!block || !t;
  $("#tplNote").innerHTML = block ? `<div class="note-box bad"><b>Don't send.</b> ${esc(block)}</div>` : (t?.subject ? `<div class="lbl" dir="auto">Subject: ${esc(fillTemplate(t.subject, l, t.language))}</div>` : "");
  const body = t ? fillTemplate(t.body, l, t.language) : "Add messages in the Messages tab.";

  $("#tplLog").disabled = S.tplBlocked || !S.writable;
  const wa = $("#tplWa"); const ph = digits(l.phone);
  if (ph && t && !S.tplBlocked) { wa.href = `https://wa.me/${ph}?text=${encodeURIComponent(body)}`; wa.removeAttribute("aria-disabled"); wa.style.opacity = ""; wa.style.pointerEvents = ""; }
  else { wa.removeAttribute("href"); wa.setAttribute("aria-disabled", "true"); wa.style.opacity = ".5"; wa.style.pointerEvents = "none"; }
}
function renderTimeline() {

$("#drawerRoot").addEventListener("click", async (e) => {
  const l = lead(); if (!l) return;
  if (e.target.closest("[data-close]")) { closeDrawer(); return; }
  const st = e.target.closest("[data-stage]"); if (st) { requestStage(l, st.dataset.stage); return; }
  const sn = e.target.closest("[data-snooze]"); if (sn) { await updateLead(l.id, { nextActionDate: addDays(todayISO(), Number(sn.dataset.snooze)) }); return; }
  if (e.target.closest("#assignMe")) { if (S.me?.id) await updateLead(l.id, { assignedTo: S.me.id }); return; }
  if (e.target.closest("#setPrice")) { openPriceModal(l); return; }
  if (e.target.closest("#markSent")) { await markQuoteSent(l); return; }
  if (e.target.closest("#pauseClaude")) {
    const v = !l.claudePaused;
    if (await updateLead(l.id, { claudePaused: v }, { type: "note", text: v ? "Claude paused on this lead. The team handles this customer." : "Claude resumed on this lead." })) toast(v ? "Claude paused on this lead" : "Claude resumed on this lead");
    return;
  }
  if (e.target.closest("#needPrice")) { setStage(l, "awaiting_price"); return; }
  if (e.target.closest("#depPaid")) { setStage(l, "confirmed", {}, "50% deposit received"); return; }
  if (e.target.closest("#balPaid")) {
    const patch = { balanceStatus: "received", balanceReceivedAt: Date.now() };
    if (l.eventDate && l.eventDate <= todayISO()) await setStage(l, "completed", patch, "Balance received");
    else await updateLead(l.id, patch, { type: "payment", text: "50% balance received" });
    return;
  }
  if (e.target.closest("#markLost")) { openLostModal(l); return; }
  if (e.target.closest("#addNote")) {
    const text = $("#noteText").value.trim(); if (!text) return;
    const type = $("#noteType").value;
    const ok = await write(async () => {
      await addActivity(l.id, type, text);
      const patch = { updatedAt: Date.now() };
      if (type !== "note") patch.lastContactAt = Date.now();
      await S.db.doc("leads/" + l.id).update(patch);
    });
    if (ok) $("#noteText").value = "";
    return;
  }
  if (e.target.closest("#tplCopy")) {
    if (S.tplBlocked) return;
    const t = S.templates.find((x) => x.id === $("#tplPick").value);
    const subject = t?.subject ? `Subject: ${fillTemplate(t.subject, l, t.language)}\n\n` : "";
    copyText(subject + $("#tplPreview").textContent, $("#tplPreview"));
    return;
  }
  if (e.target.closest("#tplLog")) {
    const t = S.templates.find((x) => x.id === $("#tplPick").value);
    if (!t || S.tplBlocked) return;
    const sendsPrice = /\{price\}/.test(t.body || "") && priceUnsent(l);
    const now = Date.now();
    const ok = await write(async () => {
      await addActivity(l.id, t.channel === "email" ? "email" : "whatsapp", `Sent "${t.name || "message"}":\n${$("#tplPreview").textContent}`);
      const patch = { lastContactAt: now, updatedAt: now };
      if (!l.firstReplyAt) patch.firstReplyAt = now;
      await S.db.doc("leads/" + l.id).update(patch);
    });
    if (!ok) return;
    if (sendsPrice) await markQuoteSent(l, `Price sent by the team ("${t.name}")`);
    else toast("Logged");
    return;
  }
  if (e.target.closest("#delLead")) { openConfirm("Delete this lead?", "The lead is removed for everyone. Its timeline stays in storage but won't be shown.", "Delete", async () => { await write(() => S.db.doc("leads/" + l.id).delete()); closeDrawer(); toast("Lead deleted"); }); return; }
});
$("#drawerRoot").addEventListener("change", async (e) => {

    <p style="margin:0;color:var(--muted)">Enter the price excl. VAT and the exact words the customer will read. Claude passes the wording on as written.${lang ? ` This customer writes in ${lang}, so write it in ${lang}.` : ""}</p>
    ${c.length ? `<div class="note-box bad"><b>Date clash.</b> Also on ${esc(fmtDate(l.eventDate))}: ${esc(clashNames(c))}. Check crew and kit before you price.</div>` : ""}
    <div class="field"><label for="m-price">Price (AED, excl. VAT)</label><input id="m-price" name="price" type="number" min="1" step="1" value="${esc(l.priceAED ?? "")}" required></div>
    <div class="field"><label for="m-details">What the customer will read</label><textarea id="m-details" name="details" rows="4" dir="auto" placeholder="AED 28,000 + 5% VAT: lighting, 6x3m LED wall, sound, stage, setup and 2 technicians">${esc(l.quoteDetails || "")}</textarea></div>
    <div class="field"><label for="m-checked">Date and kit checked by</label><input id="m-checked" name="checkedBy" dir="auto" value="${esc(l.dateCheckedBy || "")}" placeholder="Name or initials of who checked the date, crew and equipment" required></div>
    <div class="checks"><label><input type="checkbox" name="sent">I already sent this price to the customer myself</label></div>
    <p style="margin:0;color:var(--muted);font-size:13px">${isTrial()
      ? "Leave it unticked and Claude drafts the price message on its next run, for you to review in the Trial tab. Nothing is sent in trial mode."
      : "Leave it unticked and Claude sends this price to the customer on its next run."} Tick it if the customer already has this price: the quote is marked sent and stays valid for ${QUOTE_VALID_DAYS} days.</p>
    <div class="actions"><button class="btn primary" type="submit">Save price</button><button class="btn" type="button" data-cancel>Cancel</button></div>`,
  async (fd) => {
    const price = Number(fd.get("price"));
    if (!(price > 0)) { toast("Enter the price in AED, excl. VAT."); return false; }
    const checkedBy = String(fd.get("checkedBy") || "").trim();
    if (!checkedBy) { toast("Fill in who checked the date and kit."); $("#m-checked")?.focus(); return false; }
    const details = String(fd.get("details") || "").trim() || `${aed(price)} + 5% VAT`;
    const now = Date.now();
    const patch = { priceAED: price, quoteDetails: details, priceSetAt: now, dateCheckedBy: checkedBy };
    if (!fd.get("sent")) {
      Object.assign(patch, { priceToSend: true, nextAction: "Claude: send this price", nextActionDate: todayISO() });
      const ok = await updateLead(l.id, patch, { type: "quote", text: `Price entered for Claude to ${isTrial() ? "draft" : "send"} (checked by ${checkedBy}): ${details}` });
      if (ok) toast(isTrial() ? "Price saved. Claude drafts the message on its next run." : "Price saved. Claude sends it on its next run.");
      return ok;
    }
    Object.assign(patch, quoteSentPatch(now));
    const note = `Price sent by the team (checked by ${checkedBy}), valid until ${fmtDate(patch.quoteValidUntil)}: ${details}`;
    const ok = (STAGE[l.stage]?.i ?? 0) < STAGE.quoted.i ? await setStage(l, "quoted", patch, note) : await updateLead(l.id, patch, { type: "quote", text: note });
    if (ok) toast(`Price saved. Quote valid until ${fmtDate(patch.quoteValidUntil)}.`);
    return ok;
  });
}
function openLostModal(l) {
  openModal(`<h3>Mark as lost</h3><div class="field"><label for="m-reason">Why?</label><select id="m-reason" name="reason">${LOST_REASONS.map((r) => `<option>${r}</option>`).join("")}</select></div>
    <div class="field"><label for="m-lnote">Details (optional)</label><textarea id="m-lnote" name="note" rows="2" dir="auto"></textarea></div>
    <div class="actions"><button class="btn primary" type="submit">Mark lost</button><button class="btn" type="button" data-cancel>Cancel</button></div>`,
  async (fd) => { await setStage(l, "lost", { lostReason: fd.get("reason") }, [fd.get("reason"), fd.get("note")].filter(Boolean).join(": ")); });
}

const PROSPECT_FIELDS = [["company", "Company"], ["segment", "Segment"], ["emirate", "Emirate"], ["website", "Website"], ["contactName", "Contact name"], ["role", "Role"], ["email", "Business email"], ["phone", "Business phone"], ["sourceUrl", "Where you found them (link)"], ["whyFit", "Why they could need EchoLight"], ["notes", "Notes"]];
function openProspectModal(p) {
  const v = p || {};
  const dis = S.writable ? "" : "disabled";
  openModal(`<h3>${p ? esc(v.company || "Prospect") : "New prospect"}</h3>
    <div class="fields">${PROSPECT_FIELDS.map(([k, label]) => {
      if (k === "segment") return `<div class="field"><label for="p-${k}">${label}</label><select id="p-${k}" name="${k}" ${dis}><option value="">—</option>${SEGMENTS.map((s) => `<option ${v[k] === s ? "selected" : ""}>${esc(s)}</option>`).join("")}</select></div>`;
      if (k === "emirate") return `<div class="field"><label for="p-${k}">${label}</label><select id="p-${k}" name="${k}" ${dis}><option value="">—</option>${EMIRATES.map((s) => `<option ${v[k] === s ? "selected" : ""}>${esc(s)}</option>`).join("")}</select></div>`;
      if (k === "whyFit" || k === "notes") return `<div class="field full"><label for="p-${k}">${label}</label><textarea id="p-${k}" name="${k}" rows="2" dir="auto" ${dis}>${esc(v[k] || "")}</textarea></div>`;
      return `<div class="field"><label for="p-${k}">${label}</label><input id="p-${k}" name="${k}" value="${esc(v[k] || "")}" dir="auto" ${dis} ${k === "company" ? "required" : ""}></div>`;
    }).join("")}
    ${p ? `<div class="field"><label for="p-status">Status</label><select id="p-status" name="status" ${dis}>${PROSPECT_STATUSES.map((s) => `<option value="${s.id}" ${v.status === s.id ? "selected" : ""}>${s.label}</option>`).join("")}</select></div>` : ""}
    </div>
    ${v.outreachLog?.length ? `<div><span class="lbl">Outreach so far</span>${v.outreachLog.slice(-5).map((o) => `<div class="act" style="margin-top:6px"><div class="when">${esc(o.channel || "")} · ${o.at ? new Date(o.at).toLocaleDateString("en-GB") : ""}</div><p dir="auto">${esc(o.summary || "")}</p></div>`).join("")}</div>` : ""}
    <div class="actions"><button class="btn primary" type="submit" ${dis}>${p ? "Save" : "Add prospect"}</button><button class="btn" type="button" data-cancel>Close</button></div>`,
  async (fd) => {
    const data = Object.fromEntries(fd.entries());
    if (p) return write(() => S.db.doc("prospects/" + p.id).update({ ...data, updatedAt: Date.now() }));
    return write(() => S.db.collection("prospects").add({ ...data, status: "found", addedBy: S.me?.id || null, touches: 0, outreachLog: [], createdAt: Date.now(), updatedAt: Date.now() }));
  });
}
async function convertProspect(id) {
  const p = S.prospects.find((x) => x.id === id); if (!p) return;
  const ref = S.db.collection("leads").doc();
  const ok = await write(async () => {
    await ref.set(newLeadDoc({ name: p.contactName || "", company: p.company || "", phone: p.phone || "", email: p.email || "", segment: p.segment || "", emirate: p.emirate || "", source: p.addedBy === "claude" ? "Outbound (Claude)" : "Outbound (team)", requirements: p.whyFit || "", prospectId: p.id, stage: "qualifying", stageHistory: { new: Date.now(), qualifying: Date.now() } }));
    await addActivity(ref.id, "note", `Converted from prospect ${p.company}`);
    await S.db.doc("prospects/" + p.id).update({ status: "converted", leadId: ref.id, updatedAt: Date.now() });
  });
  if (ok) { toast("Lead created"); openDrawer(ref.id); }
}

function openTemplateModal(t) {
  const v = t || { channel: "whatsapp", language: "en" };
  openModal(`<h3>${t ? "Edit message" : "New message"}</h3>
    <div class="fields">
      <div class="field full"><label for="t-name">Name</label><input id="t-name" name="name" value="${esc(v.name || "")}" required></div>
      <div class="field"><label for="t-channel">Channel</label><select id="t-channel" name="channel">${["whatsapp", "email", "instagram", "linkedin"].map((c) => `<option ${v.channel === c ? "selected" : ""}>${c}</option>`).join("")}</select></div>
      <div class="field"><label for="t-lang">Language</label><select id="t-lang" name="language"><option value="en" ${v.language === "en" ? "selected" : ""}>English</option><option value="ar" ${v.language === "ar" ? "selected" : ""}>Arabic</option></select></div>
      <div class="field"><label for="t-stage">Stage</label><select id="t-stage" name="stage"><option value="">Any</option>${STAGES.map((s) => `<option value="${s.id}" ${v.stage === s.id ? "selected" : ""}>${s.label}</option>`).join("")}</select></div>
      <div class="field full"><label for="t-subject">Email subject (optional)</label><input id="t-subject" name="subject" value="${esc(v.subject || "")}" dir="auto"></div>
      <div class="field full"><label for="t-body">Message</label><textarea id="t-body" name="body" rows="7" dir="auto" required>${esc(v.body || "")}</textarea></div>
    </div>
    <div class="actions"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" data-cancel>Cancel</button>${t ? `<button class="btn ghost danger" type="button" id="tDel">Delete</button>` : ""}</div>`,
  async (fd) => {
    const data = Object.fromEntries(fd.entries());
    if (t) return write(() => S.db.doc("templates/" + t.id).update({ ...data, updatedAt: Date.now() }));
    return write(() => S.db.collection("templates").add({ ...data, order: 99, updatedAt: Date.now() }));
  });
  const del = $("#tDel"); if (del) del.addEventListener("click", async () => { await write(() => S.db.doc("templates/" + t.id).delete()); closeModal(); toast("Message deleted"); });
}

boot();
})();
</script>
